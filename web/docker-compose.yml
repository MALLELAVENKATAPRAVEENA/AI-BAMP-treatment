version: '3.8'

services:
  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: bamp_ai_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=info
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bamp_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - ai-service
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: bamp_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: bamp_network
