name: Master Enterprise Test Suite Pipeline (5 Excel Reports)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Selenium Web E2E Automation Suite (300+ Specs)
  # =========================================================================
  selenium-e2e-suite:
    name: 🌐 1. Selenium E2E Web Suite (300+ Specs)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'selenium-e2e/package-lock.json'

      - name: Install Selenium Dependencies
        run: |
          cd selenium-e2e
          npm ci || npm install

      - name: Verify Google Chrome Browser
        run: |
          google-chrome --version || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)

      - name: Discover React Routes & Generate 300 Specs
        run: |
          cd selenium-e2e
          npm run discover-routes

      - name: Execute Selenium E2E Test Suite
        env:
          BASE_URL: 'https://bamp-1de96.web.app'
          CROSS_BROWSER: 'chrome'
          HEADLESS: 'true'
        run: |
          cd selenium-e2e
          npm run test

      - name: Generate E2E Excel Report
        if: always()
        run: |
          cd selenium-e2e
          npm run report:excel

      - name: Upload Artifact 1/5 -> Selenium Web E2E Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1_Selenium_Web_E2E_Report.xlsx
          path: selenium-e2e/excel/E2E_Report.xlsx
          retention-days: 30

  # =========================================================================
  # 2. Appium Mobile E2E Automation Suite (300+ Mobile Specs)
  # =========================================================================
  appium-mobile-e2e-suite:
    name: 📱 2. Appium Mobile E2E Suite (300+ Specs)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'appium-e2e/package-lock.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Appium 2.x & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true
          appium -v

      - name: Install Appium Dependencies
        run: |
          cd appium-e2e
          npm ci || npm install

      - name: Discover Mobile Screens & Generate 300 Specs
        run: |
          cd appium-e2e
          npm run discover-routes

      - name: Execute Appium Mobile E2E Test Suite
        env:
          APP_PACKAGE: 'com.bamp.ai'
          APP_ACTIVITY: 'com.bamp.ai.MainActivity'
        run: |
          cd appium-e2e
          npm run test

      - name: Generate Mobile Excel Report
        if: always()
        run: |
          cd appium-e2e
          npm run report:excel

      - name: Upload Artifact 2/5 -> Appium Mobile E2E Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2_Appium_Mobile_E2E_Report.xlsx
          path: appium-e2e/excel/Mobile_E2E_Report.xlsx
          retention-days: 30

  # =========================================================================
  # 3. High-Concurrency Load & Stress Suite (100 VUs / 60s)
  # =========================================================================
  high-concurrency-load-suite:
    name: ⚡ 3. High-Concurrency Load Suite (100 VUs / 60s)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'load-test/package-lock.json'

      - name: Install Load Test Dependencies
        run: |
          cd load-test
          npm ci || npm install

      - name: Execute 100-VU / 60s Load Test
        env:
          TARGET_URL: 'https://bamp-1de96.web.app'
          CONNECTIONS: '100'
          DURATION: '60'
        run: |
          cd load-test
          npm run load-test

      - name: Upload Artifact 3/5 -> Load Testing Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3_High_Concurrency_Load_Report.xlsx
          path: load-test/excel/Load_Testing_Report.xlsx
          retention-days: 30

  # =========================================================================
  # 4. REST API Integration Suite (300+ Specs)
  # =========================================================================
  api-integration-suite:
    name: 🔌 4. REST API Integration Suite (300+ Specs)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'api-test/package-lock.json'

      - name: Install API Test Dependencies
        run: |
          cd api-test
          npm ci || npm install

      - name: Discover REST API Endpoints & Generate 300 Specs
        run: |
          cd api-test
          npm run discover-routes

      - name: Execute REST API Integration Test Suite
        env:
          API_BASE_URL: 'https://bamp-1de96.web.app'
        run: |
          cd api-test
          npm run test

      - name: Generate API Excel Report
        if: always()
        run: |
          cd api-test
          npm run report:excel

      - name: Upload Artifact 4/5 -> REST API Integration Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4_REST_API_Integration_Report.xlsx
          path: api-test/excel/API_Testing_Report.xlsx
          retention-days: 30

  # =========================================================================
  # 5. Master Combined Excel Artifact Packaging Job (All 5 Excel Reports)
  # =========================================================================
  master-excel-reports-package:
    name: 📊 5. Package ALL 5 Excel Reports
    needs: [selenium-e2e-suite, appium-mobile-e2e-suite, high-concurrency-load-suite, api-integration-suite]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Artifact 1 - Selenium E2E
        uses: actions/download-artifact@v4
        with:
          name: 1_Selenium_Web_E2E_Report.xlsx
          path: selenium-e2e/excel/
        continue-on-error: true

      - name: Download Artifact 2 - Appium Mobile E2E
        uses: actions/download-artifact@v4
        with:
          name: 2_Appium_Mobile_E2E_Report.xlsx
          path: appium-e2e/excel/
        continue-on-error: true

      - name: Download Artifact 3 - Load Test
        uses: actions/download-artifact@v4
        with:
          name: 3_High_Concurrency_Load_Report.xlsx
          path: load-test/excel/
        continue-on-error: true

      - name: Download Artifact 4 - API Integration Test
        uses: actions/download-artifact@v4
        with:
          name: 4_REST_API_Integration_Report.xlsx
          path: api-test/excel/
        continue-on-error: true

      - name: Build 5th Master Combined Excel Report
        run: |
          cd api-test && npm install exceljs || true
          cd ..
          node scripts/generateMasterCombinedExcel.js

      - name: Upload Final Downloadable ZIP Package (ALL 5 EXCEL REPORTS)
        uses: actions/upload-artifact@v4
        with:
          name: ALL-5-ENTERPRISE-EXCEL-REPORTS
          path: excel/*.xlsx
          retention-days: 30
