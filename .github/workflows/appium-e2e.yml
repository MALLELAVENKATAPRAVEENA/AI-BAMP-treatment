name: Enterprise Appium Mobile E2E Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-mobile-e2e:
    name: Execute Appium 2.x Mobile E2E Test Suite (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'appium-e2e/package-lock.json'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Install Appium 2.x & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true
          appium -v

      - name: 5. Install Appium E2E Dependencies
        run: |
          cd appium-e2e
          npm ci || npm install

      - name: 6. Execute Dynamic Mobile Screen & Form Discovery
        run: |
          cd appium-e2e
          npm run discover-routes

      - name: 7. Run Appium Mobile Headless E2E Tests
        env:
          APP_PACKAGE: 'com.bamp.ai'
          APP_ACTIVITY: 'com.bamp.ai.MainActivity'
        run: |
          cd appium-e2e
          npm run test

      - name: 8. Generate Mobile Excel & Mochawesome HTML Reports
        if: always()
        run: |
          cd appium-e2e
          npm run report:excel

      - name: 9. Upload Mobile E2E Test Artifacts (Excel & HTML Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-E2E-Downloadable-Reports
          path: |
            appium-e2e/excel/
            appium-e2e/reports/
            appium-e2e/logs/
          if-no-files-found: warn
          retention-days: 30
