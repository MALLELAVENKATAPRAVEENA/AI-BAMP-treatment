name: Enterprise Selenium E2E Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    name: Execute Selenium E2E Test Suite (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'selenium-e2e/package-lock.json'

      - name: 3. Install Selenium E2E Dependencies
        run: |
          cd selenium-e2e
          npm ci || npm install

      - name: 4. Verify Google Chrome Browser
        run: |
          google-chrome --version || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)

      - name: 5. Execute Dynamic React Route & Form Discovery
        run: |
          cd selenium-e2e
          npm run discover-routes

      - name: 6. Run Selenium Headless E2E Tests on Firebase Host (Chrome)
        env:
          BASE_URL: 'https://bamp-1de96.web.app'
          CROSS_BROWSER: 'chrome'
          HEADLESS: 'true'
        run: |
          cd selenium-e2e
          npm run test

      - name: 7. Generate Excel & Mochawesome HTML Reports
        if: always()
        run: |
          cd selenium-e2e
          npm run report:excel

      - name: 8. Upload E2E Test Artifacts (Excel & HTML Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-E2E-Downloadable-Reports
          path: |
            selenium-e2e/excel/
            selenium-e2e/reports/
            selenium-e2e/logs/
          if-no-files-found: warn
          retention-days: 30
